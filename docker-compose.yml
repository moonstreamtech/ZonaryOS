services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: zonaryos
      POSTGRES_PASSWORD: zonaryos
      POSTGRES_DB: zonaryos
    ports:
      - "5432:5432"
    volumes:
      - zonaryos-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zonaryos -d zonaryos"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"

volumes:
  zonaryos-postgres-data:
