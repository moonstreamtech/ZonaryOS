# Agent pipeline - step 1 of 5: smoke test.
#
# This workflow answers exactly one question: can aider, driven by Google
# Gemini's free API tier, read this repository and produce a diff that
# still compiles? It is deliberately read-only - it never commits, never
# pushes, and never opens a pull request. `permissions: contents: read`
# makes the job structurally incapable of writing back to the repository;
# any edits aider makes land only in the ephemeral runner's working tree
# and are discarded when the job ends (or explicitly reset in the final
# step below).
#
# Later steps in the agent pipeline (the autonomous loop, the issue queue,
# the label state machine, the scheduled trigger) build on top of what
# this step proves works. None of that is wired up here.

name: Agent Smoke Test

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Natural-language instruction to hand to aider"
        required: true
        default: >-
          Add a short doc comment to one existing exported Go function that
          does not already have one. Pick a single small, low-risk function.
          Do not touch anything else.
      files:
        description: "Space-separated paths to place in aider's editable context (optional; leave empty to rely on aider's repo map)"
        required: false
        default: ""
      model:
        description: "Gemini editor model id (applies the diff) - default is Flash Lite, the only model with a daily quota (500 RPD) that survives running in a loop; confirm the exact id against the 'List available Gemini models' step's log"
        required: false
        default: "gemini/gemini-3.5-flash-lite"
      edit_format:
        # aider 0.86.2 (newest on PyPI) has zero Gemini 3.x entries in its
        # built-in model-settings table, so an unrecognized model like
        # gemini-3.5-flash-lite silently falls back to ModelSettings'
        # edit_format default: "whole" (re-emit the entire file verbatim).
        # Run 33320566501 hit this exactly: the model wrote a correct doc
        # comment but replied with a diff hunk, not a whole file, so aider
        # could apply nothing - zero errors, zero edits. This input, plus
        # .github/aider-model-settings.yml (which sets edit_format per
        # pooled model for runs that don't override it here), is the fix.
        # Made an input rather than hardcoded so diff / diff-fenced / udiff
        # can be A/B'd by re-dispatching, no code change, no PR - quota is
        # cheap enough now (2 of 500 daily requests for run 2) to make that
        # worth doing. Valid values are aider 0.86.2's actual registered
        # coder formats (confirmed via aider.coders, not guessed): diff,
        # diff-fenced, udiff, udiff-simple, whole, patch, context, ask,
        # architect, editor-diff, editor-diff-fenced, editor-whole, help.
        description: "aider --edit-format to request from the model (see comment above the input for why this exists and the exact accepted values)"
        required: false
        default: "diff-fenced"
      architect_model:
        # Defined but unused for now - see the "Run aider" step's comment.
        # gemini-3.7-flash is 5 RPM / 20 RPD; run 33313795551 spent 9 of
        # those 20 requests retrying a single 503 outage into a
        # self-inflicted 429, for zero output. Architect mode returns once
        # step 3's litellm model-pool router can fail over to another model
        # on 503/429 instead of hammering the same one.
        description: "Gemini architect model id (unused for now - see comment above the input; kept so this input is ready when architect mode returns)"
        required: false
        default: "gemini/gemini-3.7-flash"

env:
  GO_VERSION: "1.25"

# Only one manual smoke-test run at a time.
concurrency:
  group: agent-smoke-test
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  agent-smoke-test:
    name: Agent Smoke Test (aider + Gemini)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # aider's repo map wants full git history

      - name: Validate task/files inputs are not swapped
        # Run 33313795551 dispatched with task and files swapped: task
        # received a bare path ("internal/alerting/alerting.go") and files
        # received the real instruction sentence. read -ra then split that
        # sentence on whitespace into ~24 bogus "file" arguments, and
        # --yes-always let aider create all of them as empty files before
        # any API call happened. Catch that here, before Go/Python setup,
        # so a bad dispatch costs seconds instead of minutes and quota.
        # Step 3 takes task text from an issue body, so this check is
        # needed permanently, not just for manual dispatch typos.
        env:
          TASK: ${{ inputs.task }}
          FILES: ${{ inputs.files }}
          EDIT_FORMAT: ${{ inputs.edit_format }}
        run: |
          read -ra FILE_ARGS <<< "$FILES"
          for f in "${FILE_ARGS[@]}"; do
            if [ ! -f "$f" ]; then
              echo "files input contains a path that does not exist in this repo: '$f'" >&2
              echo "task was: $TASK" >&2
              echo "files was: $FILES" >&2
              exit 1
            fi
          done

          # A task with no spaces that also looks like a path (contains a
          # slash, or ends in a common source-file extension) is very
          # unlikely to be a real natural-language instruction.
          if [[ "$TASK" != *" "* ]] && { [[ "$TASK" == *"/"* ]] || [[ "$TASK" =~ \.(go|ts|tsx|js|jsx|py|md|yml|yaml|json|sql|sh|css|mjs|cjs)$ ]]; }; then
            echo "task and files look swapped: task has no spaces and looks like a file path, not an instruction." >&2
            echo "task was: $TASK" >&2
            echo "files was: $FILES" >&2
            exit 1
          fi

          # aider 0.86.2's actual registered coder edit formats (aider.coders),
          # confirmed by import, not guessed - a typo here would otherwise
          # only surface as an aider argparse error after Install aider has
          # already spent ~35s.
          valid_edit_formats="architect ask context diff diff-fenced editor-diff editor-diff-fenced editor-whole help patch udiff udiff-simple whole"
          if [[ ! " $valid_edit_formats " == *" $EDIT_FORMAT "* ]]; then
            echo "edit_format '$EDIT_FORMAT' is not one of aider 0.86.2's registered edit formats:" >&2
            echo "  $valid_edit_formats" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with: { go-version: "${{ env.GO_VERSION }}" }

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install aider
        # Pinned: we verified every flag this workflow uses against this
        # exact release. A future aider release changing a flag name should
        # not silently break this workflow.
        run: python3 -m pip install aider-chat==0.86.2

      - name: Print aider version
        run: aider --version

      - name: List available Gemini models
        # --no-gitignore matters here too: aider appends `.aider*` to
        # .gitignore on startup, and this repo's .gitignore has no such
        # entry yet. Without this flag, even this listing-only step would
        # modify a tracked file before the real run below has done anything.
        run: aider --no-gitignore --list-models gemini/
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Assert working tree is still clean before the real run
        # Nothing above this point should have touched the working tree.
        # If it has, the diff read at the end would no longer be
        # attributable to aider's actual run - which is the one thing this
        # smoke test exists to measure.
        run: |
          if ! git diff --quiet; then
            echo "Working tree was modified before aider's real run started:" >&2
            git --no-pager diff >&2
            exit 1
          fi

      - name: Write task instruction to file
        env:
          TASK: ${{ inputs.task }}
        run: printf '%s' "$TASK" > /tmp/agent-task.txt

      - name: Run aider
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Makes litellm (aider's LLM client) log the raw HTTP request/
          # response for every call, headers included - the only way to see
          # whatever rate-limit info Gemini's API surfaces. GitHub Actions
          # masks the literal GEMINI_API_KEY value anywhere it appears in
          # this log, so this does not leak the secret.
          LITELLM_LOG: DEBUG
          FILES: ${{ inputs.files }}
        run: |
          set -o pipefail
          read -ra FILE_ARGS <<< "$FILES"
          # No --architect / --editor-model here: architect mode needs a
          # second model call per turn, and run 33313795551 showed a single
          # flaky architect-tier model can burn most of its daily quota on
          # retries alone. Editor model only, direct, until step 3's
          # model-pool router can absorb a flaky upstream by failing over
          # instead of retrying the same model. inputs.architect_model is
          # kept defined (unused) for when that lands.
          #
          # TODO(step 3, --yes-always below): --yes-always is what let
          # aider create 24 empty files from the swapped-input run's bogus
          # arguments without asking. The input-validation step above
          # removes that trigger for manual dispatch, but step 3 feeds task
          # text from an untrusted issue body - --yes-always plus untrusted
          # input needs a real guard before that lands, not just this check.
          aider \
            --model "${{ inputs.model }}" \
            --edit-format "${{ inputs.edit_format }}" \
            --model-settings-file .github/aider-model-settings.yml \
            --message-file /tmp/agent-task.txt \
            --no-auto-commits \
            --yes-always \
            --no-check-update \
            --no-analytics \
            --no-gitignore \
            --no-pretty \
            --no-stream \
            --map-tokens 4096 \
            --verbose \
            "${FILE_ARGS[@]}" \
            | tee /tmp/aider-run.log

      - name: Show rate-limit info surfaced by this run
        if: always()
        run: |
          if [ -f /tmp/aider-run.log ] && grep -iE 'ratelimit|rate-limit|retry-after|quota' /tmp/aider-run.log; then
            :
          else
            echo "No rate-limit headers or quota info were surfaced in this run's log."
          fi

      - name: Show diff stat
        run: git --no-pager diff --stat

      - name: Show diff
        run: git --no-pager diff

      - name: Fail if aider produced no changes
        run: |
          if git diff --quiet; then
            echo "aider produced no changes - this is a smoke test failure, not a pass." >&2
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: License header check
        run: python3 scripts/license_headers.py --check

      - name: Save diff for the artifact upload
        if: always()
        run: git --no-pager diff > /tmp/agent-diff.patch

      - name: Upload diff artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-diff
          path: /tmp/agent-diff.patch
          if-no-files-found: ignore

      - name: Print resolved dispatch inputs
        # Diagnosing run 33320566501 needed the literal task/files/model
        # values, but get_job_logs (the tool used to pull this workflow's
        # logs for review) clamps to the last ~5000 lines of a job log, and
        # this job's early steps - where those values are normally first
        # printed via each step's own env: dump - had already scrolled out
        # of that window by the time the dense repo-map debug output ran.
        # The raw log-download URL is also blocked by egress policy for
        # whoever is diagnosing a failure this way. Printing everything as
        # one compact line near the end of the job, after the log-heavy
        # steps, keeps it inside whatever tail is actually reachable.
        if: always()
        env:
          TASK: ${{ inputs.task }}
          FILES: ${{ inputs.files }}
          MODEL: ${{ inputs.model }}
          EDIT_FORMAT: ${{ inputs.edit_format }}
        run: |
          echo "RESOLVED INPUTS: model=$MODEL edit_format=$EDIT_FORMAT files=[$FILES] task=[$TASK]"

      - name: Reset working tree
        if: always()
        run: |
          git reset --hard HEAD
          git clean -fd
