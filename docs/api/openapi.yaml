openapi: 3.0.3
info:
  title: ZonaryOS API
  version: "0.1.0"
  description: >
    ZonaryOS backend HTTP API. Versioned per CLAUDE.md Never-Violate Rule 6
    (no breaking changes without a deprecation cycle) - this file is the
    source of truth for the API's current shape and should be updated
    alongside any handler change, even before automated contract-diff CI
    exists.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      summary: Liveness check
      security: []
      responses:
        "200":
          description: Server is up
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /.well-known/zonaryos-central:
    get:
      summary: Resolve this installation's currently-known central-server address
      description: >
        Open Points item 34/40 (internal/discovery). Today every
        installation answers self-referentially, with its own configured
        ZONARYOS_PUBLIC_URL - there is no separate central server yet.
        Every installation's own internal/discovery.Client periodically
        fetches this same endpoint (from whichever address it last
        resolved, walking forward) to discover a real future central
        server migration without requiring a code or config change.
        Unauthenticated and unconditional - see
        internal/discovery.RegisterRoutes's doc comment for why this has
        no default-off gate unlike license/telemetry.
      security: []
      responses:
        "200":
          description: The current central-server base URL, as this installation understands it
          content:
            application/json:
              schema:
                type: object
                properties:
                  centralUrl:
                    type: string
                    description: >
                      This installation's own public base URL (empty if
                      ZONARYOS_PUBLIC_URL isn't configured, e.g. plain
                      local dev) - never a placeholder or third-party
                      value.
                    example: https://zonaryos.duckdns.org
                required: [centralUrl]

  /telemetry/report:
    post:
      summary: Ingest a batched usage-telemetry report (aggregate counts only)
      description: >
        Open Points item 40 (internal/telemetry). The "central server"
        side of the reporting flow - today every installation both sends
        to and (via this handler) receives its own reports, since Open
        Points item 34's real separate central server doesn't exist yet.
        Only reachable at all when ZONARYOS_TELEMETRY_ENABLED=true on
        this installation (internal/telemetry.RegisterRoutes registers
        nothing when disabled - a request to this path 404s exactly as
        if the package were never imported). Logs a one-line count
        summary; does not persist to Postgres (no retention/access-
        control story exists yet for this data - see
        docs/OPEN_POINTS.md's KVKK cross-reference).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryReport"
      responses:
        "202":
          description: Report accepted (counts only, aggregate, never content - see internal/telemetry's doc comment)
        "400":
          description: Malformed report body

  /telemetry/client-report:
    post:
      summary: Ingest a batched client-side (frontend) usage-telemetry report
      description: >
        What the web frontend's own batching client
        (web/src/lib/telemetry.ts, flushed via the frontend's
        /api/telemetry route handler - see that route's doc comment) and
        this same Next.js server process's own route handlers
        (web/src/lib/telemetryServer.ts) POST periodically: page/screen
        view counts by route and named feature-usage-event counts only -
        never page content or request/response bodies. Merged into
        internal/telemetry.Reporter's own counters, then flushed onward
        to /telemetry/report on the resolved central address alongside
        this installation's server-side (Go) request/source-IP counts.
        Only reachable when ZONARYOS_TELEMETRY_ENABLED=true, same as
        /telemetry/report above.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelemetryClientReport"
      responses:
        "202":
          description: Report accepted
        "400":
          description: Malformed report body

  /api/me:
    get:
      summary: Resolve the caller's identity and firm memberships
      description: >
        Verifies the bearer token, upserts the caller into ZonaryOS's own
        `users` table by Keycloak subject, and lists every firm they
        belong to. Keycloak only proves who the caller is - this endpoint
        is where that identity is resolved against ZonaryOS's own
        authorization data (users/firms/roles/user_firm_roles).
      responses:
        "200":
          description: Identity and firm memberships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: Missing or invalid bearer token

  /api/me/firms/{firmID}/role:
    get:
      summary: Resolve the caller's role within one specific firm
      description: >
        Opens a firm-scoped, Row-Level-Security-enforced transaction for
        firmID. A caller with no membership in that firm gets 403 -
        enforced by the database's RLS policy, not by an application-level
        membership check.
      parameters:
        - name: firmID
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The caller's role within firmID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleInFirm"
        "400":
          description: firmID is not a valid UUID
        "401":
          description: Missing or invalid bearer token
        "403":
          description: Caller has no membership in firmID

  /api/firms/{firmID}:
    get:
      summary: Read a firm's name and broader metadata (member-gated)
      description: >
        Open Points item 36's read counterpart to the PATCH below -
        internal/firm.Get. Gated by plain membership
        (internal/permission.IsMember), not IsOwner: viewing a firm's own
        basic info doesn't need the stricter owner tier that editing it
        does. Every metadata field is nullable - null means the firm never
        set it (migrations/0006_firm_metadata.up.sql's no-backfill NULL
        default), not that the field doesn't exist.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The firm's current name and metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmMetadata"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Caller isn't a member of firmID at all }
    patch:
      summary: Update a firm's name and broader metadata (owner-only)
      description: >
        Item 4's original minimal, bounded firm mutation
        (internal/firm.UpdateName) - name only - extended by Open Points
        item 36 to also accept five optional metadata fields
        (address/taxId/defaultLocale/defaultCurrency/logoUrl,
        internal/firm.Update/UpdateFields) at this same route, rather than
        a second endpoint. Owner-gated (internal/permission.IsOwner, after
        IsMember), same tier as defining a new workflow or creating the
        firm itself. Every metadata field is optional and nullable: name
        is required (as it always was), while address/taxId/defaultLocale/
        defaultCurrency/logoUrl are each independently omittable (leave
        the stored value alone), settable to an empty string (clear it
        back to unset/null), or settable to a non-empty value (subject to
        a basic sanity length cap - see the 400 response below) - a caller
        that only wants to rename the firm can still send just `name`, and
        that keeps behaving exactly as it did before this field set
        existed. Storage-only for every new field: no fiscal/tax
        calculation or validation tied to taxId/defaultCurrency
        (docs/OPEN_POINTS.md item 24 stays open), no upload/storage system
        behind logoUrl (a URL string only). Broader firm-settings-as-a-
        real-module questions (the `firms.attributes` jsonb column, e.g.)
        remain real, undesigned future work - see docs/OPEN_POINTS.md item
        36's remaining open questions.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                address:
                  type: string
                  nullable: true
                  description: Free text, up to 500 characters. No structured address model - see docs/OPEN_POINTS.md item 24.
                taxId:
                  type: string
                  nullable: true
                  description: Free text (VAT/tax ID), up to 100 characters. No country-specific format validation.
                defaultLocale:
                  type: string
                  nullable: true
                  description: Free text, up to 20 characters. Expected to be one of this deployment's actual locale codes ("en"/"tr" today, web/src/i18n/routing.ts), but not DB-constrained to that set.
                defaultCurrency:
                  type: string
                  nullable: true
                  description: Free text, up to 10 characters. Expected to look like an ISO 4217 code, but not validated against a real currency list and not wired into any calculation.
                logoUrl:
                  type: string
                  nullable: true
                  description: Free text URL, up to 2048 characters. No upload/storage system behind this - a link to an image hosted elsewhere, nothing else.
              required: [name]
      responses:
        "200":
          description: The firm's new name and metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmMetadata"
        "400": { description: Invalid firmID, malformed body, an empty/whitespace-only name, or a metadata field exceeding its maximum allowed length }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID at all }

  /api/firms/{firmID}/workflow-definitions:
    get:
      summary: >
        With ?key=, resolve a well-known workflow key to its firm-scoped
        definition ID; without it, list every workflow definition the
        firm has
      description: >
        Two modes on one path, dispatched by whether the `key` query
        parameter was given - not two routes, since a path-segment
        variant (e.g. "by-key/{key}" or "all") collides with the sibling
        `{definitionID}/instances` path below at startup (net/http's
        ServeMux rejects the pair as an ambiguous pattern; neither is
        more specific than the other at every differing segment).

        With `key`: lets a caller that only knows a workflow's well-known
        key (see internal/workflow's *Key constants, e.g. StockToSaleKey)
        resolve the UUID every other workflow endpoint takes, without a
        separate "list all definitions" round trip.

        Without `key`: lists every workflow definition the firm has,
        ordered by name - the data source for a firm-level "Workflows"
        view that doesn't hardcode one card per known workflow key.

        Both modes are membership-checked (internal/permission.IsMember):
        a firmID the caller genuinely isn't a member of resolves to the
        same 404 as an unknown key (key mode) or an empty array never
        happens for a non-member (list mode also 404s, not 200 with an
        empty list) - a non-member can't distinguish "no definitions"
        from "not your firm."
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: query
          required: false
          description: When given, resolve exactly this key. When omitted, list every definition instead.
          schema: { type: string }
      responses:
        "200":
          description: >
            With `key`: the matching workflow definition (a single
            object). Without `key`: every workflow definition for the
            firm (an array).
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/WorkflowDefinition"
                  - type: array
                    items:
                      $ref: "#/components/schemas/WorkflowDefinition"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "404": { description: "(key mode only) No workflow definition with this key in this firm, or the caller isn't a member of firmID" }
    post:
      summary: Define a new workflow for this firm (owner-only)
      description: >
        Exposes internal/workflow.DefineWorkflow/DefineWorkflowTx over
        HTTP - the same mechanism that already defines every firm's
        stock_to_sale workflow (internal/workflow.SeedStockToSaleWorkflow),
        now reachable by a firm's owner directly instead of only from Go
        fixtures/the firm-creation wizard. This is strictly the workflow
        engine's existing definition mechanism (states, transitions,
        per-transition permission keys) - not the Rule Engine / conditional
        decision logic Vision §3 also describes (docs/OPEN_POINTS.md item
        12), which remains undesigned and out of scope here.

        Owner-gated (internal/permission.IsOwner, after IsMember) -
        defining a new workflow type is a structural firm decision, the
        same tier as firm creation itself, not something every member can
        do. On success, every permission the spec introduces (its create
        permission, plus each transition's) is granted to the acting
        owner's own owner-flagged role (the same "self-action auto-grant"
        DefineWorkflowTx already performs for the firm-creation wizard) -
        the firm isn't left holding a freshly-defined workflow nobody can
        use.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DefinitionSpec"
      responses:
        "201":
          description: The newly-defined workflow definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDefinition"
        "400": { description: Invalid firmID, malformed request body, or a structurally invalid spec (DefinitionSpec.Validate - no initial state, a transition referencing an unknown state, an OPTIONAL `fields` entry with an empty/duplicate name, a type outside string/number/boolean/date/enum/reference/array, an enum field with zero options, an array field's `arrayItemType` set to enum/reference/array, a reference field with an empty `referenceDefinitionKey`, or a reference field whose `referenceDefinitionKey` doesn't name a real workflow definition for this firm, ...) }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID at all }
        "409": { description: firmID already has a workflow definition with this key }

  /api/firms/{firmID}/workflow-definitions/{definitionID}/instances:
    post:
      summary: Start a new instance of a workflow definition ("add stock")
      description: >
        Creates a new workflow_instances row in the definition's initial
        state. Not modeled as a transition (creation has no from-state),
        but enforced and audited identically: gated by the definition's
        create_permission_key, and recorded in audit_log.

        If the target definition has an OPTIONAL payload schema
        (`fields` on WorkflowDefinition/DefinitionSpec - Open Points item
        35, extended by item 38), payload is validated against it before
        the instance is created: every required field must be present,
        and a present field's value must match its declared type
        (internal/workflow.ErrPayloadValidation, surfaced as 400 below) -
        including, for a `reference` field, an actual database check that
        the value is a real instance ID of the named definition in this
        same firm (a cross-firm reference is rejected the same as a
        nonexistent one), run inside the same transaction as the instance
        insert. A definition with no schema (every definition that
        predates item 35, e.g. stock_to_sale/customer_pipeline today)
        skips this entirely - payload stays accepted exactly as before.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: definitionID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "201":
          description: The new instance's state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceState"
        "400": { description: Invalid firmID/definitionID, malformed body, or (when the definition has a payload schema) a missing required field/wrong-typed field - internal/workflow.ErrPayloadValidation's message, same plain-text error body shape every other 4xx in this API already uses }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller lacks the definition's create permission }
        "404": { description: No such workflow definition in this firm }
    get:
      summary: List every instance of a workflow definition (e.g. a stock list)
      description: >
        Not filtered by the caller's own *permissions* - same convention
        as reading one instance's state: enforcement happens when an
        action is actually executed, not when instances are merely
        listed. It is membership-checked though
        (internal/permission.IsMember): a firmID the caller isn't a
        member of resolves to 404, the same as an unknown definitionID -
        RLS alone (Never-Violate Rule 3) confines the query to rows
        matching the firmID given, but by itself doesn't prove the caller
        has any right to that firmID.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: definitionID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: >
            Caps the number of instances returned, for paging. Omitted
            (or 0) means "no limit" - every matching instance, the same
            response this endpoint always returned before pagination
            existed. Capped server-side at 200; a larger value is a 400,
            not a silently-clamped 200.
          schema: { type: integer, minimum: 0, maximum: 200 }
        - name: offset
          in: query
          required: false
          description: Skips this many matching instances before applying limit. Ignored when limit is omitted.
          schema: { type: integer, minimum: 0 }
        - name: q
          in: query
          required: false
          description: >
            Case-insensitive substring match against the instance's
            current state (key/name) or its raw payload text - generic
            across any workflow definition's payload shape, not a
            fixed field name.
          schema: { type: string }
      responses:
        "200":
          description: >
            The matching instances (paged/filtered per the query params
            above). The total matching count before paging is reported
            via the X-Total-Count response header, not in the body -
            the body stays a plain array so this remains a
            non-breaking change for any existing caller.
          headers:
            X-Total-Count:
              description: Total instances matching definitionID and q, before limit/offset is applied.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InstanceState"
        "400": { description: Invalid firmID/definitionID, or an invalid limit/offset }
        "401": { description: Missing or invalid bearer token }
        "404": { description: No such workflow definition, or the caller isn't a member of firmID }

  /api/firms/{firmID}/workflow-instance-counts:
    get:
      summary: Instance counts by state, across every workflow definition in the firm (dashboard overview)
      description: >
        A later batch's addition: for every workflow definition the firm
        has, how many instances currently sit in each state - one
        grouped COUNT query server-side (internal/workflow.InstanceCountsByDefinition),
        not the caller fetching every instance and counting client-side.
        Every state appears, even one with zero instances (a LEFT JOIN
        from workflow_states out to workflow_instances) - a dashboard
        rendering "0 sold" is more honest than silently omitting a row.
        A separate top-level path rather than nested under
        /workflow-definitions, since this aggregates across every
        definition at once rather than being scoped to one
        {definitionID} - additive-only, no existing route's shape
        changed (Never-Violate Rule 6). Not filtered by the caller's own
        permissions (same convention as the instances-listing endpoint
        above); membership-checked (internal/permission.IsMember).
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Every workflow definition's instance counts, broken down by state
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DefinitionInstanceCounts"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "404": { description: The caller isn't a member of firmID }

  /api/firms/{firmID}/workflow-instances/{instanceID}:
    get:
      summary: Read a workflow instance's current state
      description: >
        Available actions are listed regardless of the caller's own
        permissions - enforcement happens when a transition is actually
        executed, not here. Membership-checked though
        (internal/permission.IsMember): reading another firm's instance
        by ID, even a genuinely existing one, resolves to the same 404 as
        an unknown instanceID.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: instanceID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The instance's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceState"
        "400": { description: Invalid firmID/instanceID }
        "401": { description: Missing or invalid bearer token }
        "404": { description: No such workflow instance in this firm }

  /api/firms/{firmID}/workflow-instances/{instanceID}/transitions/{actionKey}:
    post:
      summary: Execute a transition on a workflow instance ("record a sale")
      description: >
        Moves the instance from its current state via the transition
        matching actionKey, gated by that transition's permission_key, all
        inside one firm-scoped transaction. Fails with 400 if no such
        transition exists from the instance's current state (e.g. already
        in a terminal state).
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: instanceID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: actionKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                payload:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: The instance's state after the transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InstanceState"
        "400": { description: Invalid IDs, malformed body, or no such transition from the current state }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller lacks the transition's required permission }
        "404": { description: No such workflow instance in this firm }

  /api/wizard/nodes/{nodeKey}:
    get:
      summary: Read one node of the firm-creation wizard's decision tree
      description: >
        Not scoped under /api/firms/{firmID}/... like the workflow engine's
        routes - a newly-authenticated user with zero firm memberships has
        no firm yet, same bootstrap category as /api/me. nodeKey "root" is
        the wizard's entry point.
      parameters:
        - name: nodeKey
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The requested node
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardNode"
        "401": { description: Missing or invalid bearer token }
        "404": { description: No such wizard node }

  /api/wizard/nodes/{nodeKey}/answer:
    post:
      summary: Submit an answer at a wizard question node
      description: >
        Resolves the next node reached by answering. If that node is the
        create-default-firm action, the firm (with its default "owner"
        role, the caller's membership in it, and a seeded Stock In -> Sale
        workflow) is created in one atomic transaction and returned inline
        as `result` - no separate confirmation round trip is needed.
      parameters:
        - name: nodeKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                answer:
                  type: string
                  description: One of the node's Answers[].value.
                firmName:
                  type: string
                  description: Required only when the answer resolves to the create-default-firm action.
              required: [answer]
      responses:
        "200":
          description: The resulting node (question, placeholder, or action - with `result` populated for create-default-firm)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WizardNode"
        "400": { description: Malformed body, unknown answer value, node is not a question, or firm creation failed (e.g. blank firm name) }
        "401": { description: Missing or invalid bearer token }
        "404": { description: No such wizard node }

  /api/firms/{firmID}/permission-audit:
    get:
      summary: Permission Audit Mode's role-permission matrix (Vision §3)
      description: >
        Owner-only (see internal/permission's IsOwner - the working
        assumption for "an authorized user" in Vision §3, no separate
        manage_permissions key exists yet). Returns the caller's own
        permission keys (across every role they hold, so their own Audit
        Mode badges are accurate) plus every non-owner role's grants -
        owner-flagged roles never appear in `roles`, matching "roles at
        the highest permission tier ... don't appear in these lists."
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The firm's permission audit matrix
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmPermissionAudit"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller is not a member of firmID at all }

  /api/firms/{firmID}/permission-catalog:
    get:
      summary: Every permission key that exists for the firm, and which roles hold each
      description: >
        Owner-only, same gate as permission-audit above (this endpoint's
        internal/permission.GetFirmPermissionCatalog is built on top of
        GetFirmPermissionAudit rather than a second, parallel path). The
        data source for the full permission-management page
        (/settings/permissions) as opposed to permission-audit's
        role-keyed shape (Permission Audit Mode's live overlay): a
        firm-scoped union of every key referenced by the firm's own
        workflow_definitions.create_permission_key /
        workflow_transitions.permission_key, plus every key any non-owner
        role already holds - so a key defined but never granted to
        anyone still appears, with an empty roleKeys array, which
        permission-audit's response has no way to represent.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The firm's full permission catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FirmPermissionCatalog"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller is not a member of firmID at all }

  /api/firms/{firmID}/roles/{roleID}/permissions/{key}:
    put:
      summary: Grant a permission key to a role (Permission Audit Mode's "add")
      description: >
        Owner-only, idempotent, saved immediately (Vision §3: "the change
        is saved immediately"). Rejects owner-flagged role targets
        server-side regardless of what the frontend offers - never trust
        the client for that. Writes one audit_log row
        (entity_type "role_permission").
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: roleID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: path
          required: true
          schema: { type: string }
          description: The permission key to grant (must already exist in the global permissions catalog).
      responses:
        "204": { description: Granted (or already held) }
        "400": { description: Invalid IDs, the role is owner-flagged, or the permission key doesn't exist in the catalog }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID, or roleID doesn't exist in it }
    delete:
      summary: Revoke a permission key from a role (Permission Audit Mode's "remove")
      description: >
        Owner-only, idempotent (revoking a permission a role never held is
        not an error). Same owner-role rejection and audit_log write as
        the grant side.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: roleID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: key
          in: path
          required: true
          schema: { type: string }
      responses:
        "204": { description: Revoked (or already absent) }
        "400": { description: Invalid IDs, or the role is owner-flagged }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID, or roleID doesn't exist in it }

  /api/firms/{firmID}/permission-events:
    get:
      summary: Server-Sent Events stream of "this firm's permissions changed" notifications
      description: >
        Open to any firm member (not owner-only like the endpoints above -
        Vision §3's "active sessions for the affected role are
        reconnected" means the affected role's own sessions, not just an
        owner watching Audit Mode). One `event: permissions-changed` per
        grant/revoke anywhere in the firm; clients re-fetch whatever
        state they care about on receipt rather than trying to apply a
        diff. In-process only (internal/permission.Broadcaster) - see
        docs/DEVELOPMENT.md for why, and its single-process caveat.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: text/event-stream of permissions-changed events, held open until the client disconnects
          content:
            text/event-stream:
              schema:
                type: string
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Caller isn't a member of firmID }

  /api/firms/{firmID}/roles:
    post:
      summary: Create a new, non-owner role for the firm (owner-only)
      description: >
        Item 5's role-creation mechanism: internal/wizard.CreateDefaultFirm's
        own doc comment already says the firm owner is expected to
        configure roles for others via Permission Audit Mode, but until
        this endpoint existed there was no way to create a role at all -
        every firm was permanently stuck with exactly the one is_owner
        role the wizard seeds. The new role always starts with zero
        permission grants (is_owner is never settable here - only firm
        creation sets it) and shows up in GET .../permission-audit and
        GET .../permission-catalog immediately, the same read paths every
        other role already appears in.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                key:
                  type: string
                  description: Machine-readable role identifier, unique within the firm.
                name:
                  type: string
                  description: Display name.
              required: [key, name]
      responses:
        "201":
          description: The new role
          content:
            application/json:
              schema:
                type: object
                properties:
                  roleId: { type: string, format: uuid }
                  key: { type: string }
                  name: { type: string }
                required: [roleId, key, name]
        "400": { description: Invalid firmID, malformed body, or an empty/whitespace-only key/name }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID at all }
        "409": { description: A role with this key already exists for this firm }

  /api/firms/{firmID}/roles/{roleID}:
    patch:
      summary: Rename a role (owner-only)
      description: >
        Changes only the role's display name - roles.key (the
        machine-readable identifier role_permissions/user_firm_roles
        reference) is immutable through this endpoint, unlike a display
        name a key change would be a breaking identity change for
        anything already referencing the role. Rejects an owner-flagged
        target (400) the same way the grant/revoke endpoints above do -
        the is_owner role can never be renamed through this surface.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: roleID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
              required: [name]
      responses:
        "204": { description: Renamed }
        "400": { description: Invalid IDs, an empty/whitespace-only name, or the role is owner-flagged }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID, or roleID doesn't exist in it }
    delete:
      summary: Delete a role (owner-only)
      description: >
        Rejects an owner-flagged target the same way rename does - the
        is_owner role can never be deleted through this surface, even by
        the owner themself. Blocked (409) while the role still has at
        least one member (user_firm_roles row) rather than
        cascade-unassigning them - user_firm_roles has no "reassign to a
        default role" concept in this schema, so a cascading delete would
        silently remove those members' firm membership entirely, not
        just their role. Reassign or remove the role's members first.
        role_permissions rows for the deleted role are cleaned up via
        their own ON DELETE CASCADE.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: roleID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Deleted }
        "400": { description: Invalid IDs, or the role is owner-flagged }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID, or roleID doesn't exist in it }
        "409": { description: The role still has at least one member }

  /api/firms/{firmID}/members:
    get:
      summary: List every (user, role) pairing in the firm - item 3's firm roster
      description: >
        Membership-gated only (any member can see their own firm's
        roster), not owner-only like permission-audit/permission-catalog
        above - "who's on my team and what's their role" isn't treated as
        owner-only sensitive information in this codebase, the same
        visibility level as the generic workflow instance list. See
        /api/firms/{firmID}/invites below for how a second real user now
        gets into a firm (Open Points item 17's email integration itself
        stays deferred - this is a shareable link, never an email). A user
        holding more than one role in the same firm (user_firm_roles
        allows this) appears once per (user, role) pairing, not collapsed
        into a single row.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The firm's roster
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FirmMember"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "404": { description: Caller is not a member of firmID at all }

  /api/firms/{firmID}/invites:
    post:
      summary: Generate a new invite link for the firm (owner-only)
      description: >
        Open Points item 17's companion gap ("no way to get a second real
        user into a firm") resolved without any email infrastructure -
        item 17 itself (email integration) stays fully deferred. Returns
        an opaque, unguessable token (see internal/invite.generateToken);
        the frontend builds a shareable link out of it
        (/invite/{token}, a public Next.js route) that the owner copies
        and shares by whatever channel they already use. roleID must
        belong to firmID - a role ID from a different firm is
        structurally invisible to this endpoint's own RLS-scoped query
        (roles.roles_tenant_isolation, migrations/0001_core_schema.up.sql),
        not merely application-checked, so it is rejected the same way a
        genuinely nonexistent role ID would be (400). Expires
        DefaultExpiry (7 days) from creation; not configurable per-invite.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                roleId: { type: string, format: uuid }
              required: [roleId]
      responses:
        "201":
          description: The new invite, including its one-time-visible token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invite"
        "400": { description: Invalid firmID/roleID, malformed body, or roleID doesn't belong to firmID }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID at all }
    get:
      summary: List every invite this firm has ever generated (owner-only)
      description: >
        Most recent first. The token itself is never included here -
        only the POST response above ever carries it, since the owner is
        expected to have already copied the link out at creation time.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: This firm's invites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Invite"
        "400": { description: Invalid firmID }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID at all }

  /api/firms/{firmID}/invites/{inviteID}/revoke:
    post:
      summary: Revoke a pending invite (owner-only)
      description: >
        Marks the invite revoked - the row is never deleted, matching
        this codebase's general soft-state preference (e.g.
        internal/permission.DeleteRole's own precedent), so a revoked
        invite stays visible in GET .../invites as its own record of what
        was revoked and by/when. Only a currently-pending invite can be
        revoked (409 otherwise - already used or already revoked).
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: inviteID
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Revoked }
        "400": { description: Invalid IDs }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but not an owner }
        "404": { description: Caller isn't a member of firmID, or the invite doesn't exist in it }
        "409": { description: The invite is already used or already revoked }

  /api/invites/{token}:
    get:
      summary: Look up an invite by its token (public - no bearer token)
      description: >
        Genuinely public: the whole point is to let an unauthenticated
        visitor see what they were invited to (firm name, role name)
        before they sign in at all - see internal/invite's package doc
        comment and migrations/0007_firm_invites.up.sql's RLS read
        carve-out (app_current_invite_token()). A token that never
        existed at all is 404; every other non-happy-path (used, revoked,
        pending-but-expired) is a successful 200 response whose body
        describes exactly which one, so the frontend can show a specific,
        correct message instead of one generic error.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The invite's current state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteInfo"
        "404": { description: No invite exists for this token at all }

  /api/invites/{token}/accept:
    post:
      summary: Accept an invite, granting the caller its role in its firm
      description: >
        Requires a valid bearer token (some authenticated ZonaryOS
        identity to grant the role to) but deliberately NOT firm
        membership - this is the one endpoint in this system that must
        work for a caller who is not yet a member of the target firm at
        all; the firm itself is derived entirely from the token, never
        supplied by the caller. Single-use: a second accept attempt on an
        already-used token fails with 409. Re-accepting the exact same
        role you already hold (e.g. a duplicate click) is a harmless
        no-op for the membership row, but the invite is still marked used
        either way.
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The firm/role the caller was just granted
          content:
            application/json:
              schema:
                type: object
                properties:
                  firmId: { type: string, format: uuid }
                  roleId: { type: string, format: uuid }
                  roleName: { type: string }
                required: [firmId, roleId, roleName]
        "400": { description: Invalid/empty token }
        "401": { description: Missing or invalid bearer token }
        "404": { description: No invite exists for this token at all }
        "409": { description: The invite has already been used, or has been revoked }
        "410": { description: The invite has expired }

  /api/firms/{firmID}/audit-log:
    get:
      summary: Read this firm's audit trail (Vision §3 Audit Trail Infrastructure)
      description: >
        Gated by internal/auditlog.ReadPermission through the ordinary
        permission.IsMember + Has check (not a hardcoded owner-only gate),
        so a firm can later extend read access to an "Auditor Role" purely
        by granting this permission key via Permission Audit Mode.
        internal/wizard.CreateDefaultFirm grants it to a firm's own owner
        role automatically. Returns audit_log rows for the firm, most
        recent first, covering both data-change entries (action values like
        "create", "grant", "revoke", "record_sale", ...) and view/read
        entries (action "view") - see docs/DEVELOPMENT.md's Audit Trail
        section and docs/OPEN_POINTS.md item 33 for why view/read logging
        is only wired into one representative read path so far. Supports
        the same limit/offset paging shape as
        /api/firms/{firmID}/workflow-definitions/{definitionID}/instances
        (internal/workflow.ListInstances), plus date-range and workflow-
        definition filtering - see the query params below. Omitting every
        query param returns every entry, unpaged, the same response this
        endpoint always returned before this - Never-Violate Rule 6, no
        breaking change without a deprecation cycle.
      parameters:
        - name: firmID
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          required: false
          description: >
            Caps the number of entries returned, for paging. Omitted (or
            0) means "no limit" - every matching entry, the same response
            this endpoint always returned before pagination existed.
            Capped server-side at 200; a larger value is a 400, not a
            silently-clamped 200.
          schema: { type: integer, minimum: 0, maximum: 200 }
        - name: offset
          in: query
          required: false
          description: Skips this many matching entries before applying limit. Ignored when limit is omitted.
          schema: { type: integer, minimum: 0 }
        - name: from
          in: query
          required: false
          description: RFC3339 timestamp - keeps only entries with occurred_at >= from (inclusive).
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          description: RFC3339 timestamp - keeps only entries with occurred_at <= to (inclusive).
          schema: { type: string, format: date-time }
        - name: definitionId
          in: query
          required: false
          description: >
            Keeps only entries that resolve back to this workflow
            definition - rows whose entity_type is "workflow_instance" and
            whose entity_id is an instance of this definition, joined
            through workflow_instances.workflow_definition_id
            (internal/auditlog.List). audit_log rows unrelated to any
            workflow instance (a firm rename, a permission grant, ...)
            never match a definitionId filter, by design.
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: >
            The matching entries (paged/filtered per the query params
            above), most recent first. The total matching count before
            paging is reported via the X-Total-Count response header, not
            in the body - the body stays a plain array so this remains a
            non-breaking change for any existing caller.
          headers:
            X-Total-Count:
              description: Total entries matching firmID plus any from/to/definitionId filter, before limit/offset is applied.
              schema: { type: integer }
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLogEntry"
        "400": { description: Invalid firmID, or an invalid limit/offset/from/to/definitionId }
        "401": { description: Missing or invalid bearer token }
        "403": { description: Caller is a member of firmID but does not hold audit.log.read }
        "404": { description: Caller isn't a member of firmID at all }

  /api/platform-admin/firms:
    get:
      summary: Read-only firm metadata across every firm (ZonaryOS platform staff only)
      description: >
        internal/platformadmin - a narrow, cross-firm read distinct from
        every other endpoint in this API (which are all scoped to one
        firm the caller belongs to). Gated by a hardcoded,
        env-var-driven allowlist of platform-operator staff emails
        (internal/platformadmin.Allowlist), checked against the caller's
        already-verified Keycloak identity - not firm membership or any
        role/permission grant. Returns only firm name, created_at, a
        workflow-definition count, and a member count per firm - never
        tenant business data. Every access is logged into each returned
        firm's own audit_log (action "platform_admin_metadata_view").
        A non-allowlisted (but otherwise authenticated) caller gets 404,
        not 403 - this endpoint is designed to look like it doesn't exist
        to anyone off the allowlist, matching the frontend route's
        next/navigation notFound() behavior at /platform-admin.
        Also gated by internal/license (Open Points item 32) - the one
        module-gating call site this codebase wires today
        (license.ModulePlatformAdmin). With ZONARYOS_LICENSE_ENFORCEMENT
        unset (the default), this check is a structural no-op and never
        changes this endpoint's behavior. With enforcement enabled and
        the license invalid/expired-past-grace/missing this module, the
        request fails closed with 503 and a plain-text, actionable
        message (which env var to fix and what to do) - checked only
        after the allowlist check above, so a non-allowlisted caller
        still just gets 404 and never learns anything about license
        state.
      responses:
        "200":
          description: Firm metadata for every firm in the system
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAdminFirm"
        "401": { description: Missing or invalid bearer token }
        "404": { description: Caller is authenticated but not on the platform-admin allowlist }
        "503":
          description: >
            License enforcement is enabled (ZONARYOS_LICENSE_ENFORCEMENT=true)
            and the configured license is missing, invalid, expired past
            its grace period, or does not include the platform_admin
            module. Response body is plain text with a specific,
            actionable message (which env var to fix, and how) - not a
            generic "unauthorized". Only ever returned for an otherwise
            allowlisted caller (see above).
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: A Keycloak-issued access token for the `zonaryos` realm.
  schemas:
    MeFirm:
      type: object
      properties:
        firmId:
          type: string
          format: uuid
        firmName:
          type: string
        roleId:
          type: string
          format: uuid
      required: [firmId, firmName, roleId]
    Me:
      type: object
      properties:
        subject:
          type: string
          description: Keycloak "sub" claim.
        email:
          type: string
        displayName:
          type: string
        firms:
          type: array
          items:
            $ref: "#/components/schemas/MeFirm"
      required: [subject, email, displayName, firms]
    RoleInFirm:
      type: object
      properties:
        firmId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        roleKey:
          type: string
        roleName:
          type: string
        isOwner:
          type: boolean
          description: Mirrors roles.is_owner - cosmetic only, never a permission bypass. The frontend uses this to decide whether to show the Permission Audit Mode toggle.
      required: [firmId, roleId, roleKey, roleName, isOwner]
    StateInfo:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
      required: [key, name]
    AvailableAction:
      type: object
      properties:
        actionKey:
          type: string
        name:
          type: string
        toState:
          $ref: "#/components/schemas/StateInfo"
        permissionKey:
          type: string
          description: The permission ExecuteTransition checks for this action - included so a UI can carry the Never-Violate Rule 7 permission tag without hardcoding a duplicate of it.
      required: [actionKey, name, toState, permissionKey]
    FieldSpec:
      type: object
      description: >
        One declared field in a workflow definition's OPTIONAL instance
        payload schema (internal/workflow.FieldSpec). Open Points item 35
        introduced the four scalar types; item 38 extended it with `enum`,
        `reference`, and `array` - each of those three needs exactly one
        of `options`/`referenceDefinitionKey`/`arrayItemType` set (see each
        property's own description). No nested objects, no arrays of
        enum/reference/array (see `arrayItemType`), no pattern constraints
        beyond `enum`'s fixed option set.
      properties:
        name:
          type: string
        type:
          type: string
          enum: [string, number, boolean, date, enum, reference, array]
          description: >
            "date" is a plain calendar date, no time-of-day/timezone -
            matched against `YYYY-MM-DD` server-side
            (internal/workflow's payloadDateLayout), the same value an
            HTML `<input type="date">` produces. "enum"/"reference"/"array"
            are Open Points item 38's additions - see `options`/
            `referenceDefinitionKey`/`arrayItemType` below.
        required:
          type: boolean
          description: Whether CreateInstance must see this field present in the payload.
        options:
          type: array
          items: { type: string }
          description: >
            Only meaningful when `type` is `enum`: the fixed set of string
            values this field's value must be one of. Required to be
            non-empty (and every option unique, non-empty) when `type` is
            `enum`; must be omitted/empty for every other type -
            DefinitionSpec.Validate rejects either mismatch at
            spec-definition time.
        referenceDefinitionKey:
          type: string
          description: >
            Only meaningful when `type` is `reference`: the `key` of
            another workflow definition in the same firm (e.g.
            "stock_to_sale") whose instances this field's value must
            identify. CreateInstance validates the value is a real
            instance ID (UUID) of that definition, in the same firm, as
            part of the same transaction that creates the new instance
            (internal/workflow.checkReferenceField) - a value that doesn't
            resolve, or that resolves to an instance in a different firm,
            is rejected as 400 the same way a missing required field is.
            Must be omitted for every other type.
        arrayItemType:
          type: string
          enum: [string, number, boolean, date]
          description: >
            Only meaningful when `type` is `array`: which of the four
            scalar types each array element must satisfy. Deliberately
            restricted to those four - `enum`/`reference`/`array` are not
            valid values here (no nested arrays, no arrays of
            enums/references), rejected by DefinitionSpec.Validate at
            spec-definition time, not merely at CreateInstance time. Must
            be omitted for every other type.
      required: [name, type, required]
    WorkflowDefinition:
      type: object
      properties:
        definitionId:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        createPermissionKey:
          type: string
          description: >
            The permission key that gates instance creation (POST
            .../instances) on this definition - lets a UI carry the real
            Never-Violate Rule 7 permission tag on its "add" action instead
            of hardcoding a duplicate of it.
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSpec"
          description: >
            OPTIONAL (Open Points item 35). Omitted entirely for a
            schema-less definition (stock_to_sale/customer_pipeline
            today) - a purely additive response field, so an existing API
            consumer sees no change at all for those. When present, a
            frontend resolving this definition (e.g. CreateInstanceForm)
            can render typed inputs for POST .../instances instead of a
            free-form key/value editor.
      required: [definitionId, key, name, createPermissionKey]
    PermissionSpec:
      type: object
      description: A permission catalog entry (internal/workflow.PermissionSpec) - upserted into the global permissions table when the workflow is defined.
      properties:
        key:
          type: string
        description:
          type: string
      required: [key]
    StateSpec:
      type: object
      description: One node in the workflow's state graph (internal/workflow.StateSpec).
      properties:
        key:
          type: string
        name:
          type: string
        isInitial:
          type: boolean
          description: Exactly one state per definition must set this.
        isTerminal:
          type: boolean
      required: [key, name]
    TransitionSpec:
      type: object
      description: One edge in the state graph (internal/workflow.TransitionSpec) - moving from one state to another via a named, permission-gated action.
      properties:
        fromStateKey:
          type: string
        toStateKey:
          type: string
        actionKey:
          type: string
        name:
          type: string
        permission:
          $ref: "#/components/schemas/PermissionSpec"
      required: [fromStateKey, toStateKey, actionKey, name, permission]
    DefinitionSpec:
      type: object
      description: >
        The full shape of a new workflow definition (internal/workflow.DefinitionSpec)
        - the request body for POST .../workflow-definitions. Validated
        server-side (DefinitionSpec.Validate): exactly one initial state,
        unique state keys, every transition referencing a state that
        actually exists, and no two transitions sharing a
        (from-state, action) pair.
      properties:
        key:
          type: string
          description: A short, unique-per-firm identifier (e.g. "purchase_order") - see workflow_definitions' UNIQUE (firm_id, key) constraint.
        name:
          type: string
        createPermission:
          $ref: "#/components/schemas/PermissionSpec"
        states:
          type: array
          items:
            $ref: "#/components/schemas/StateSpec"
        transitions:
          type: array
          items:
            $ref: "#/components/schemas/TransitionSpec"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldSpec"
          description: >
            OPTIONAL (Open Points item 35) - an OPTIONAL payload schema
            for this definition's instances. Omitted (or an empty array)
            means exactly today's behavior: CreateInstance's payload
            stays a completely freeform object, nothing required, no type
            checked. When given, CreateInstance validates every new
            instance's payload against it (400 with a
            PayloadValidationError-shaped body - see POST
            .../instances below - for a missing required field or a
            wrong-typed one); reads of already-existing instances are
            never affected either way.
      required: [key, name, createPermission, states, transitions]
    InstanceState:
      type: object
      properties:
        instanceId:
          type: string
          format: uuid
        workflowDefinitionId:
          type: string
          format: uuid
        state:
          $ref: "#/components/schemas/StateInfo"
        payload:
          type: object
          additionalProperties: true
        availableActions:
          type: array
          items:
            $ref: "#/components/schemas/AvailableAction"
      required: [instanceId, workflowDefinitionId, state, payload, availableActions]
    StateCount:
      type: object
      description: One state's instance count (internal/workflow.StateCount) - one row of DefinitionInstanceCounts.counts.
      properties:
        stateKey:
          type: string
        stateName:
          type: string
        count:
          type: integer
      required: [stateKey, stateName, count]
    DefinitionInstanceCounts:
      type: object
      description: >
        One workflow definition's instance counts, broken down by state
        (internal/workflow.DefinitionInstanceCounts) - GET
        .../workflow-instance-counts's per-item response shape.
      properties:
        definitionId:
          type: string
          format: uuid
        key:
          type: string
        name:
          type: string
        counts:
          type: array
          items:
            $ref: "#/components/schemas/StateCount"
      required: [definitionId, key, name, counts]
    WizardAnswer:
      type: object
      properties:
        value:
          type: string
        labelKey:
          type: string
          description: i18n message key (under the "Wizard" namespace) for this option's label - never literal text.
      required: [value, labelKey]
    WizardFirmResult:
      type: object
      properties:
        firmId:
          type: string
          format: uuid
        firmName:
          type: string
      required: [firmId, firmName]
    WizardNode:
      type: object
      properties:
        key:
          type: string
        kind:
          type: string
          enum: [question, action, placeholder]
        questionKey:
          type: string
          description: i18n message key for the question text. Present only when kind is "question".
        answers:
          type: array
          items:
            $ref: "#/components/schemas/WizardAnswer"
          description: Present only when kind is "question".
        placeholderKey:
          type: string
          description: i18n message key for a "not built yet" message. Present only when kind is "placeholder".
        result:
          $ref: "#/components/schemas/WizardFirmResult"
          description: Present only when this node is the create-default-firm action and it just succeeded.
      required: [key, kind]
    RoleGrant:
      type: object
      properties:
        roleId:
          type: string
          format: uuid
        roleKey:
          type: string
        roleName:
          type: string
        permissionKeys:
          type: array
          items:
            type: string
      required: [roleId, roleKey, roleName, permissionKeys]
    FirmPermissionAudit:
      type: object
      properties:
        myPermissionKeys:
          type: array
          items:
            type: string
          description: The caller's own permission keys, across every role they hold in this firm.
        roles:
          type: array
          items:
            $ref: "#/components/schemas/RoleGrant"
          description: Every non-owner role's grants - owner-flagged roles are excluded.
      required: [myPermissionKeys, roles]
    PermissionCatalogEntry:
      type: object
      properties:
        key:
          type: string
        description:
          type: string
        roleKeys:
          type: array
          items:
            type: string
          description: Non-owner role keys currently holding this permission - empty if nobody's been granted it yet.
      required: [key, description, roleKeys]
    FirmPermissionCatalog:
      type: object
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PermissionCatalogEntry"
      required: [entries]
    FirmMember:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        displayName:
          type: string
        roleId:
          type: string
          format: uuid
        roleKey:
          type: string
        roleName:
          type: string
      required: [userId, email, displayName, roleId, roleKey, roleName]
    Invite:
      type: object
      description: >
        One firm_invites row (migrations/0007_firm_invites.up.sql), as
        returned by POST/GET .../invites. token is only ever present on
        the POST response, right after creation - GET .../invites never
        re-serializes it.
      properties:
        inviteId:
          type: string
          format: uuid
        roleId:
          type: string
          format: uuid
        roleName:
          type: string
        token:
          type: string
          description: Only present on the POST (create) response.
        status:
          type: string
          enum: [pending, used, revoked]
        expired:
          type: boolean
          description: >
            True when status is still "pending" but expiresAt has
            passed - expiry is derived at read time, never persisted as
            its own status value.
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        usedAt:
          type: string
          format: date-time
      required: [inviteId, roleId, roleName, status, expired, expiresAt, createdAt]
    InviteInfo:
      type: object
      description: >
        What GET /api/invites/{token} returns - enough for the public
        /invite/{token} page to render "You've been invited to join
        <firmName> as <roleName>" or a specific reason it can't be
        accepted, with no firm context or authentication required from
        the caller.
      properties:
        firmName:
          type: string
        roleName:
          type: string
        status:
          type: string
          enum: [pending, used, revoked]
        expired:
          type: boolean
        expiresAt:
          type: string
          format: date-time
      required: [firmName, roleName, status, expired, expiresAt]
    AuditLogEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entityType:
          type: string
          description: e.g. "firm", "workflow_instance", "workflow_instance_list", "role_permission".
        entityId:
          type: string
          format: uuid
        action:
          type: string
          description: e.g. "create", "grant", "revoke", a workflow action key, or "view" for a view/read entry.
        changes:
          type: object
          description: Old/new values or other detail recorded for this entry, where feasible - empty for view/read entries.
        userId:
          type: string
          format: uuid
        userEmail:
          type: string
        userDisplayName:
          type: string
        occurredAt:
          type: string
          format: date-time
      required: [id, entityType, entityId, action, changes, userId, userEmail, userDisplayName, occurredAt]

    FirmMetadata:
      type: object
      description: >
        GET/PATCH /api/firms/{firmID}'s response shape (Open Points item
        36). address/taxId/defaultLocale/defaultCurrency/logoUrl are all
        nullable - null means the firm never set that field, matching
        migrations/0006_firm_metadata.up.sql's no-backfill NULL default.
      properties:
        firmId:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        taxId:
          type: string
          nullable: true
        defaultLocale:
          type: string
          nullable: true
        defaultCurrency:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
      required: [firmId, name, address, taxId, defaultLocale, defaultCurrency, logoUrl]

    TelemetryReport:
      type: object
      description: >
        internal/telemetry.Report's wire shape - aggregate counts only
        (Open Points item 40), keyed by identifier (an endpoint pattern,
        a source IP, or a named feature-event string), never content.
      properties:
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
        requestCounts:
          type: object
          additionalProperties:
            type: integer
          description: "\"METHOD /pattern\" (e.g. \"GET /api/firms/{firmID}\") -> request count"
        sourceIpCounts:
          type: object
          additionalProperties:
            type: integer
          description: source IP address -> request count
        featureEventCounts:
          type: object
          additionalProperties:
            type: integer
          description: named feature-usage event -> count
      required: [periodStart, periodEnd]

    TelemetryClientReport:
      type: object
      description: >
        internal/telemetry.ClientReport's wire shape - what the web
        frontend's batching client sends (Open Points item 40).
      properties:
        pageViewCounts:
          type: object
          additionalProperties:
            type: integer
          description: route path -> view count
        featureEventCounts:
          type: object
          additionalProperties:
            type: integer
          description: named feature-usage event -> count

    PlatformAdminFirm:
      type: object
      description: >
        The entire metadata surface internal/platformadmin exposes about
        one firm - nothing beyond these five fields (see that package's
        doc comment on the tenant-data boundary).
      properties:
        firmId:
          type: string
          format: uuid
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        workflowDefinitionCount:
          type: integer
        memberCount:
          type: integer
      required: [firmId, name, createdAt, workflowDefinitionCount, memberCount]
