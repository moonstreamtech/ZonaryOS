# ZonaryOS reverse proxy - near-term Oracle Cloud dev/test deployment only
# (docs/OPEN_POINTS.md item 34, docs/DEPLOYMENT.md). This is the ONE file
# ZonaryOS owns on this shared box: drop it in as
# /etc/nginx/sites-available/zonaryos.conf, symlink it into sites-enabled,
# and never edit any other site's config from this file or in its name.
#
# Proxies zonaryos.duckdns.org to two of the four host-networked containers
# started by `docker compose -f docker-compose.yml -f docker-compose.prod.yml
# up -d`:
#   - `/`      -> frontend (127.0.0.1:3000)
#   - `/auth/` -> Keycloak (127.0.0.1:8081), matching KC_HTTP_RELATIVE_PATH=/auth
#                 in docker-compose.prod.yml - the path prefix is preserved,
#                 not stripped, so Keycloak's own login theme/redirects (which
#                 are generated using that same relative path) resolve
#                 correctly through the proxy.
#
# Deliberately NOT proxied: the backend (8080) and Postgres (5432). The
# frontend reaches the backend directly over its own localhost - nothing
# public ever needs to reach it - and Postgres is never reachable from
# outside this host at all. Both stay closed at the Oracle Cloud Security
# List level regardless of what this file does (see docs/DEPLOYMENT.md's
# firewall section) - nginx not proxying them is a second layer, not the
# only one.
#
# This file intentionally has only an HTTP (port 80) server block. Run
# `certbot --nginx -d zonaryos.duckdns.org` (docs/DEPLOYMENT.md step 5) to
# get a certificate - certbot's nginx plugin edits this exact file in place,
# adding a matching 443 server block with `ssl_certificate`/
# `ssl_certificate_key` and turning this block into an HTTP->HTTPS redirect.
# Hand-writing that half here would just be certificate paths that don't
# exist yet, so it's certbot's job, not this file's.
#
# Security headers (add_header) below are placed at server{} level rather
# than duplicated into each location{}, deliberately: nginx's add_header
# inheritance rule is that a location block only fails to inherit
# server-level add_headers if that location defines its own add_header -
# neither location here does, so both `/` and `/auth/` get every header
# below. This also means the headers survive certbot's edit: certbot's
# --nginx plugin clones this entire server{} block (not just the listen/
# ssl lines) into the new 443 block it creates, so anything sitting at
# server level here - these add_header lines included - gets duplicated
# into the HTTPS block automatically. Re-verify with `sudo nginx -t` and a
# `curl -sI` after certbot runs (docs/DEPLOYMENT.md step 8) rather than
# assuming; if a future certbot version changes this cloning behavior, the
# fix is to re-add these lines to the 443 block by hand and note it here.
#
# Content-Security-Policy was checked against a real local build+serve of
# web/ (Next.js 16 / Turbopack), not pasted from a generic template:
#   - script-src needs 'unsafe-inline' because Next.js's App Router injects
#     the RSC hydration payload as inline <script> tags with no src and no
#     nonce (no CSP-nonce middleware exists in web/ today - see
#     docs/OPEN_POINTS.md if a stricter nonce-based policy is wanted later,
#     that's a frontend code change, out of scope for this nginx-only
#     batch).
#   - style-src needs 'unsafe-inline' because Next.js's built-in
#     not-found/error boundary renders an inline <style> tag
#     (dangerouslySetInnerHTML) - confirmed by inspecting the built
#     output, not assumed.
#   - next/font/google (Geist/Geist Mono, see web/src/app/[locale]/layout.tsx)
#     self-hosts font files under this app's own /_next/static/media/ at
#     build time - no fonts.gstatic.com or other external font host is
#     ever requested at runtime, so font-src/style-src need no external
#     origin.
#   - No <img>/next/image usage exists anywhere in web/src today (grepped),
#     and no external script/stylesheet/CDN reference exists either
#     (grepped for http(s):// literals) - so default-src 'self' covers
#     everything else the app actually loads.
# Verified: `npm run build` in web/, `npm run start` against the built
# output, fronted by a local Node proxy that adds this exact header set
# (standing in for nginx, which this sandbox cannot install - see the
# verification report), driven by a real headless Chromium (Playwright):
# page loaded (200), hydrated (sign-in link interactive), zero console
# errors, zero CSP-violation messages.
#
# limit_req_zone below (rate limiting for /auth/, see the location block)
# technically requires nginx's http{} context, which this file does not
# own on its own merits - BUT sites-enabled/*.conf files are themselves
# `include`d from inside the shared nginx.conf's http{} block on every
# standard Debian/Ubuntu nginx package layout (the ubiquitous convention:
# `include /etc/nginx/sites-enabled/*;` sits directly inside http{}) - so
# a directive placed here, at this file's top level (outside any server{}
# block), is parsed as if it were written directly inside http{}, without
# touching nginx.conf or any other site's file. This assumption was NOT
# confirmed against the real box (no SSH access from this session) -
# docs/DEPLOYMENT.md's step 1 now includes an explicit check
# (`sudo nginx -T | grep -B5 'sites-enabled'`) to confirm this before step
# 6 places this file; if that box turns out not to follow the standard
# layout, stop and ask rather than editing nginx.conf or a conf.d file
# outside ZonaryOS's ownership.
limit_req_zone $binary_remote_addr zone=zonaryos_auth:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name zonaryos.duckdns.org;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'" always;

    # Rate limiting on the auth surface only (login/token/registration
    # traffic through Keycloak) - deliberately not applied to `/` (normal
    # app browsing shouldn't be throttled the same way). This is a coarse
    # network-layer flood guard, not a replacement for Keycloak's own
    # per-account brute-force detection (bruteForceProtected, enabled in
    # deploy/keycloak/zonaryos-realm.json) - the two operate at different
    # layers (IP-based request rate here vs. account-based failed-attempt
    # tracking there) and are both wanted, not redundant.
    location /auth/ {
        limit_req zone=zonaryos_auth burst=20 nodelay;

        proxy_pass http://127.0.0.1:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
