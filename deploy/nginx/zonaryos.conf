# ZonaryOS reverse proxy - near-term Oracle Cloud dev/test deployment only
# (docs/OPEN_POINTS.md item 34, docs/DEPLOYMENT.md). This is the ONE file
# ZonaryOS owns on this shared box: drop it in as
# /etc/nginx/sites-available/zonaryos.conf, symlink it into sites-enabled,
# and never edit any other site's config from this file or in its name.
#
# Proxies zonaryos.duckdns.org to two of the four host-networked containers
# started by `docker compose -f docker-compose.yml -f docker-compose.prod.yml
# up -d`:
#   - `/`      -> frontend (127.0.0.1:3000)
#   - `/auth/` -> Keycloak (127.0.0.1:8081), matching KC_HTTP_RELATIVE_PATH=/auth
#                 in docker-compose.prod.yml - the path prefix is preserved,
#                 not stripped, so Keycloak's own login theme/redirects (which
#                 are generated using that same relative path) resolve
#                 correctly through the proxy.
#
# Deliberately NOT proxied: the backend (8080) and Postgres (5432). The
# frontend reaches the backend directly over its own localhost - nothing
# public ever needs to reach it - and Postgres is never reachable from
# outside this host at all. Both stay closed at the Oracle Cloud Security
# List level regardless of what this file does (see docs/DEPLOYMENT.md's
# firewall section) - nginx not proxying them is a second layer, not the
# only one.
#
# This file intentionally has only an HTTP (port 80) server block. Run
# `certbot --nginx -d zonaryos.duckdns.org` (docs/DEPLOYMENT.md step 5) to
# get a certificate - certbot's nginx plugin edits this exact file in place,
# adding a matching 443 server block with `ssl_certificate`/
# `ssl_certificate_key` and turning this block into an HTTP->HTTPS redirect.
# Hand-writing that half here would just be certificate paths that don't
# exist yet, so it's certbot's job, not this file's.
server {
    listen 80;
    listen [::]:80;
    server_name zonaryos.duckdns.org;

    location /auth/ {
        proxy_pass http://127.0.0.1:8081/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
